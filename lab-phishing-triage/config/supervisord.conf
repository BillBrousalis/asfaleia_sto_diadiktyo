[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:dovecot]
command=/usr/sbin/dovecot -F
autostart=true
autorestart=true
stdout_logfile=/var/log/dovecot.log
stderr_logfile=/var/log/dovecot.log

[program:postfix]
command=/bin/bash -c "postfix start-fg"
autostart=true
autorestart=true
stdout_logfile=/var/log/postfix.log
stderr_logfile=/var/log/postfix.log

[program:apache2]
command=/usr/sbin/apache2ctl -D FOREGROUND
autostart=true
autorestart=true
stdout_logfile=/var/log/apache2/access.log
stderr_logfile=/var/log/apache2/error.log

[program:sim]
command=python3 /opt/sim/app.py
directory=/opt/sim
autostart=true
autorestart=true
stdout_logfile=/var/log/sim.log
stderr_logfile=/var/log/sim.log
