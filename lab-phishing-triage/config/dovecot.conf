# Protocols
protocols = imap

# Logging
log_path = /var/log/dovecot.log


# Mail location — Maildir format
mail_location = maildir:/var/mail/vhosts/%d/%n

# Virtual user setup
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000

# Auth
auth_mechanisms = plain login

# Tell Dovecot to expect full email addresses as usernames
auth_username_format = %u

passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT username_format=%u /etc/dovecot/passwd
}

userdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/passwd
  default_fields = uid=vmail gid=vmail home=/var/mail/vhosts/%d/%n
}

# IMAP service
service imap-login {
  inet_listener imap {
    address = 127.0.0.1
    port = 143
  }
}

# Auth socket for Postfix (optional but avoids warnings)
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
  }
}

# Disable SSL inside the container
ssl = no