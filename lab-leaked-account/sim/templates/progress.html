{% extends "base.html" %}
{% block title %}Πρόοδος{% endblock %}
{% block bodyclass %}page{% endblock %}
{% block body %}
<main class="wrap">
  <h1>Η πρόοδός σου</h1>
  <div id="done" class="done" hidden></div>
  <p id="clock" class="clock"></p>
  <div id="banner" class="banner" hidden></div>
  <div id="tiles" class="tiles"></div>
  <div class="actions">
    <button id="attack" class="big">Δοκίμασε την άμυνά μου</button>
    <a class="link" href="/home">Αρχική οθόνη και βήματα</a>
    <button id="reset" class="link">Ξεκίνα από την αρχή</button>
  </div>
  <div id="reportbox" class="card" hidden></div>
  <h2>Τι έκανε ο απατεώνας</h2>
  <div id="events"></div>
</main>
{% endblock %}
{% block scripts %}<script src="/static/progress.js"></script>{% endblock %}
