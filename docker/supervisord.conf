[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:dovecot]
command=/usr/sbin/dovecot -F
autostart=true
autorestart=true
stdout_logfile=/var/log/dovecot.log
stderr_logfile=/var/log/dovecot.log

[program:postfix]
command=/bin/bash -c "postfix start-fg"
autostart=true
autorestart=true
stdout_logfile=/var/log/postfix.log
stderr_logfile=/var/log/postfix.log

[program:apache2]
command=/usr/sbin/apache2ctl -D FOREGROUND
autostart=true
autorestart=true
stdout_logfile=/var/log/apache2/access.log
stderr_logfile=/var/log/apache2/error.log

[program:lab-phishing]
command=python3 /opt/lab-phishing/app.py
directory=/opt/lab-phishing
autostart=true
autorestart=true
stdout_logfile=/var/log/lab-phishing.log
stderr_logfile=/var/log/lab-phishing.log

[program:lab-leaked-account]
command=python3 /opt/lab-leaked-account/app.py
directory=/opt/lab-leaked-account
environment=PORT="8091"
autostart=true
autorestart=true
stdout_logfile=/var/log/lab-leaked-account.log
stderr_logfile=/var/log/lab-leaked-account.log

[program:lab-ransomware-friday]
command=python3 /opt/lab-ransomware-friday/app.py
directory=/opt/lab-ransomware-friday
environment=PORT="8092"
autostart=true
autorestart=true
stdout_logfile=/var/log/lab-ransomware-friday.log
stderr_logfile=/var/log/lab-ransomware-friday.log
